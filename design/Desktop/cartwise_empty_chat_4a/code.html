<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>CartWise - Organic Grocery Assistant</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {

            "inverse-surface": "#30312e",

            "surface-container-high": "#eae8e4",

            "surface-container-highest": "#e4e2de",
            "tertiary-container": "#6b3700",
            "secondary-fixed-dim": "#8ad7aa",
            "outline": "#707974",
            "primary-fixed": "#baeed9",
            "error": "#ba1a1a",
            "tertiary-fixed-dim": "#ffb77d",
            "on-error-container": "#93000a",
            "on-primary-fixed": "#002117",
            "tertiary": "#4a2500",
            "on-secondary": "#ffffff",
            "on-tertiary": "#ffffff",
            "on-primary": "#ffffff",
            "surface": "#fbf9f5",
            "inverse-primary": "#9ed1bd",
            "on-background": "#1b1c1a",
            "on-tertiary-container": "#ff993b",
            "tertiary-fixed": "#ffdcc3",
            "surface-tint": "#376757",
            "surface-variant": "#e4e2de",
            "on-secondary-fixed": "#002111",
            "on-surface-variant": "#404945",
            "inverse-on-surface": "#f2f0ed",
            "outline-variant": "#c0c9c3",
            "surface-bright": "#fbf9f5",
            "error-container": "#ffdad6",
            "on-tertiary-fixed-variant": "#6e3900",
            "primary-container": "#1b4d3e",
            "background": "#fbf9f5",
            "surface-dim": "#dbdad6",
            "on-tertiary-fixed": "#2f1500",
            "on-secondary-container": "#23714c",
            "surface-container-lowest": "#ffffff",
            "secondary-container": "#a5f3c4",
            "on-primary-fixed-variant": "#1d4f40",
            "secondary": "#1b6b47",
            "on-surface": "#1b1c1a"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "margin": "1rem",
            "space-md": "1rem",
            "gutter": "1.25rem",
            "gutter-desktop": "2rem",
            "space-lg": "1.5rem",
            "margin-desktop": "3rem",
            "space-xs": "0.25rem",
            "space-xl": "2.5rem",
            "margin-tablet": "2rem",
            "space-sm": "0.5rem"
          },
          "fontFamily": {
            "headline-md": ["Plus Jakarta Sans"],
            "headline-lg": ["Plus Jakarta Sans"],
            "label-md": ["Plus Jakarta Sans"],
            "body-md": ["Plus Jakarta Sans"],
            "display-lg-mobile": ["Plus Jakarta Sans"],
            "label-lg": ["Plus Jakarta Sans"],
            "body-sm": ["Plus Jakarta Sans"],
            "label-sm": ["Plus Jakarta Sans"],
            "display-lg": ["Plus Jakarta Sans"],

            "body-sm": ["13px", { "lineHeight": "20px", "fontWeight": "400" }],
            "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }],

            "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],

            "headline-lg-mobile": ["26px", { "lineHeight": "34px", "letterSpacing": "-0.015em", "fontWeight": "600" }]

        },
      },

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
  </style>
</head>
<body class="bg-surface text-on-surface font-body-md text-body-md antialiased min-h-screen flex flex-col justify-between selection:bg-secondary-fixed selection:text-on-secondary-fixed">
<!-- TopNavBar (Shared Component Anchor) -->
<header class="bg-surface-container-lowest border-b border-outline-variant/30 sticky top-0 z-50 shadow-sm">
<div class="max-w-7xl mx-auto px-8 py-3.5 flex items-center justify-between">
<!-- Brand & Primary Nav -->
<div class="flex items-center gap-10">
<a class="flex items-center gap-2.5 text-primary" href="#">
<div class="w-8 h-8 rounded-lg bg-primary-container text-surface-container-lowest flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]" data-icon="eco" style="font-variation-settings: 'FILL' 1;">eco</span>
</div>
<span class="text-headline-sm font-headline-sm font-bold text-primary tracking-tight">CartWise</span>
</a>
<!-- Global Destination Links -->
<nav class="flex items-center gap-6">
<a class="text-primary border-b-2 border-primary pb-1 font-semibold text-label-lg font-label-lg transition-colors" href="#">Chat</a>
<a class="text-on-surface-variant pb-1 hover:text-primary transition-colors text-label-lg font-label-lg" href="#">Orders</a>
</nav>
</div>
<!-- Trailing Action Cluster -->
<div class="flex items-center gap-3.5">
<!-- New chat Action -->
<button class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full border border-primary-container text-primary font-label-lg text-label-lg hover:bg-surface-container-low transition-colors duration-150 active:scale-[0.98]">
<span class="material-symbols-outlined text-[18px]" data-icon="add">add</span>
<span class="">New chat</span>
</button>
<!-- Agent Trace Action -->
<button class="flex items-center gap-2 px-3 py-1.5 rounded-full border border-outline-variant/50 text-on-surface-variant font-label-lg text-label-lg hover:bg-surface-container-low transition-colors duration-150 active:scale-[0.98]">
<span class="w-2 h-2 rounded-full bg-secondary"></span>
<span class="">Agent Trace</span>
</button>
<div class="h-5 w-px bg-outline-variant/40 mx-1"></div>
<!-- Cart Action with Item Counter -->
<button aria-label="Shopping Cart" class="relative p-2 rounded-full text-on-surface-variant hover:text-primary hover:bg-surface-container-low transition-colors duration-150">
<span class="material-symbols-outlined text-[24px]" data-icon="shopping_cart">shopping_cart</span>
<span class="absolute top-1 right-1 flex items-center justify-center min-w-[18px] h-[18px] px-1 text-[11px] font-bold text-surface-container-lowest bg-tertiary-container rounded-full">3</span>
</button>
<!-- Account Profile Silhouette -->
<button aria-label="User Account" class="p-1 rounded-full text-on-surface-variant hover:text-primary hover:bg-surface-container-low transition-colors duration-150">
<span class="material-symbols-outlined text-[28px]" data-icon="account_circle">account_circle</span>
</button>
</div>
</div>
</header>
<!-- Main Conversational Viewport (Zero State) -->
<main class="flex-1 flex flex-col justify-center items-center px-6 py-12 max-w-4xl mx-auto w-full">
<!-- Welcome Header Presentation -->
<div class="text-center max-w-xl mx-auto mb-10">
<div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-surface-container-lowest border border-outline-variant/40 text-primary-container shadow-sm mb-5">
<span class="material-symbols-outlined text-[30px]" data-icon="temp_preferences_custom" style="font-variation-settings: 'FILL' 1;">temp_preferences_custom</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight mb-3">Welcome to CartWise</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Tell me what you want to buy, or upload a photo of a product.</p>
</div>
<!-- Suggested Query Matrix (2x2 Cards) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-3.5 w-full mb-8">
<!-- Suggestion 1 -->
<button class="group text-left p-5 rounded-xl bg-surface-container-lowest border border-outline-variant/40 hover:border-primary-container/40 hover:shadow-sm transition-all duration-200 flex items-start justify-between">
<div class="pr-4">
<span class="text-tertiary font-label-md text-label-md block mb-1">Honey &amp; Sweeteners</span>
<p class="text-on-surface font-label-lg text-label-lg group-hover:text-primary transition-colors">I want organic honey with 4.5+ rating under ₹20</p>
</div>
<div class="w-8 h-8 rounded-full bg-surface-container-low flex items-center justify-center text-on-surface-variant group-hover:bg-primary group-hover:text-surface-container-lowest transition-colors flex-shrink-0 mt-0.5">
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</div>
</button>
<!-- Suggestion 2 -->
<button class="group text-left p-5 rounded-xl bg-surface-container-lowest border border-outline-variant/40 hover:border-primary-container/40 hover:shadow-sm transition-all duration-200 flex items-start justify-between">
<div class="pr-4">
<span class="text-secondary font-label-md text-label-md block mb-1">Pantry Bundles</span>
<p class="text-on-surface font-label-lg text-label-lg group-hover:text-primary transition-colors">Find a healthy breakfast under ₹15</p>
</div>
<div class="w-8 h-8 rounded-full bg-surface-container-low flex items-center justify-center text-on-surface-variant group-hover:bg-primary group-hover:text-surface-container-lowest transition-colors flex-shrink-0 mt-0.5">
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</div>
</button>
<!-- Suggestion 3 -->
<button class="group text-left p-5 rounded-xl bg-surface-container-lowest border border-outline-variant/40 hover:border-primary-container/40 hover:shadow-sm transition-all duration-200 flex items-start justify-between">
<div class="pr-4">
<span class="text-primary-container font-label-md text-label-md block mb-1">Ingredient Deep-Dive</span>
<p class="text-on-surface font-label-lg text-label-lg group-hover:text-primary transition-colors">Compare steel-cut oats and rolled oats</p>
</div>
<div class="w-8 h-8 rounded-full bg-surface-container-low flex items-center justify-center text-on-surface-variant group-hover:bg-primary group-hover:text-surface-container-lowest transition-colors flex-shrink-0 mt-0.5">
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</div>
</button>
<!-- Suggestion 4 -->
<button class="group text-left p-5 rounded-xl bg-surface-container-lowest border border-outline-variant/40 hover:border-primary-container/40 hover:shadow-sm transition-all duration-200 flex items-start justify-between">
<div class="pr-4">
<span class="text-secondary-fixed-dim font-label-md text-label-md block mb-1">Wellness &amp; Herbal</span>
<p class="text-on-surface font-label-lg text-label-lg group-hover:text-primary transition-colors">Which tea is good for sleep?</p>
</div>
<div class="w-8 h-8 rounded-full bg-surface-container-low flex items-center justify-center text-on-surface-variant group-hover:bg-primary group-hover:text-surface-container-lowest transition-colors flex-shrink-0 mt-0.5">
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</div>
</button>
</div>
<!-- Contextual Tip Pill -->
<div class="inline-flex items-center gap-2.5 px-4 py-2 rounded-full bg-surface-container-low border border-outline-variant/30 text-on-surface-variant font-body-sm text-body-sm">
<span class="material-symbols-outlined text-[18px] text-primary" data-icon="photo_camera">photo_camera</span>
<span class="">Tip: Tap the camera icon in the search bar below to search with any photo or grocery label.</span>
</div>
</main>
<!-- Pinned Bottom Input Tray -->
<footer class="sticky bottom-0 z-40 w-full pb-8 pt-2 bg-gradient-to-t from-surface via-surface/95 to-transparent">
<div class="max-w-3xl mx-auto px-6">
<div class="relative flex items-center bg-surface-container-lowest border border-outline-variant/60 rounded-2xl p-2 pl-3 shadow-sm hover:border-outline focus-within:border-secondary focus-within:ring-2 focus-within:ring-secondary/20 transition-all duration-200">
<!-- Search By Photo Action -->
<button aria-label="Search by photo" class="p-2 text-on-surface-variant hover:text-primary hover:bg-surface-container-low rounded-xl transition-colors flex items-center justify-center flex-shrink-0" title="Search by photo" type="button">
<span class="material-symbols-outlined text-[22px]" data-icon="photo_camera">photo_camera</span>
</button>
<!-- Conversational Input -->
<input class="w-full bg-transparent border-none text-on-surface placeholder:text-outline/70 focus:ring-0 px-3 text-body-md font-body-md outline-none" placeholder="Ask CartWise or upload a photo..." type="text">
<!-- Primary Send Submission -->
<button aria-label="Send message" class="w-10 h-10 rounded-full bg-primary text-surface-container-lowest flex items-center justify-center hover:bg-primary-container transition-colors duration-150 flex-shrink-0 active:scale-95 shadow-sm" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_upward">arrow_upward</span>
</button>
</div>
</div>
</footer>


</body></html>
